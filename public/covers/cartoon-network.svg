<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="cn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#cn-bg)"/>

    <!-- Colorful geometric comic accents -->
    <circle cx="100" cy="180" r="60" fill="#06b6d4" opacity="0.15"/>
    <rect x="490" y="100" width="90" height="90" rx="16" fill="#ec4899" opacity="0.15" transform="rotate(15 535 145)"/>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#06b6d4"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="490" y="20" width="125" height="24" rx="4" fill="#ec4899"/>
    <circle cx="505" cy="32" r="4" fill="#ffffff"/>
    <text x="562" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">KIDS 24/7</text>

    <!-- Iconic [C] [N] Checkerboard Blocks -->
    <g transform="translate(320, 130) scale(1.1)">
      <!-- Block 1: Black with white C -->
      <rect x="-85" y="-55" width="80" height="80" rx="8" fill="#000000" stroke="#ffffff" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
      <text x="-45" y="6" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="62" fill="#ffffff">C</text>
      
      <!-- Block 2: White with black N -->
      <rect x="5" y="-55" width="80" height="80" rx="8" fill="#ffffff" stroke="#000000" stroke-width="4" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.6))"/>
      <text x="45" y="6" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="62" fill="#000000">N</text>
    </g>

    <text x="320" y="225" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="4">CARTOON NETWORK</text>
    <text x="320" y="255" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="15" fill="#38bdf8" letter-spacing="4">HD 24/7 ANIMATION BROADCAST</text>

    <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="1">BEN 10 • COURAGE • DEXTER • ADVENTURE TIME • GUMBALL</text>

    <!-- Bottom Rainbow Bar -->
    <rect x="0" y="352" width="213" height="8" fill="#06b6d4"/>
    <rect x="213" y="352" width="214" height="8" fill="#ffffff"/>
    <rect x="427" y="352" width="213" height="8" fill="#ec4899"/>
  </svg>