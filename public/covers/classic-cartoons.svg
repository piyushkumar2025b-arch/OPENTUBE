<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7c2d12"/>
        <stop offset="50%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#451a03"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#cc-bg)"/>

    <!-- Concentric Warner/MGM Style Golden Cartoon Rings -->
    <g fill="none" stroke="#f59e0b" opacity="0.3" stroke-width="12">
      <circle cx="320" cy="140" r="130"/>
      <circle cx="320" cy="140" r="100"/>
      <circle cx="320" cy="140" r="70"/>
    </g>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#f59e0b"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="480" y="20" width="135" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="547" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">GOLDEN TOONS</text>

    <!-- Center Typography -->
    <text x="320" y="145" text-anchor="middle" font-family="Arial Black, serif" font-weight="900" font-size="34" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.8))" letter-spacing="2">CLASSIC CARTOONS</text>
    <text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#fef08a" letter-spacing="4">NETWORK 24/7</text>

    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#fde68a" letter-spacing="2">TOM &amp; JERRY • LOONEY TUNES • POPEYE • BETTY BOOP</text>
    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#ffffff" letter-spacing="1">ORIGINAL 1930s-1960s THEATRICAL GOLDEN ERA RESTORATIONS</text>

    <rect x="0" y="352" width="640" height="8" fill="#f59e0b"/>
  </svg>