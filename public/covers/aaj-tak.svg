<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="at-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#800000"/>
        <stop offset="40%" stop-color="#b91c1c"/>
        <stop offset="80%" stop-color="#450a0a"/>
        <stop offset="100%" stop-color="#1c0000"/>
      </linearGradient>
      <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#fbbf24"/>
        <stop offset="50%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#at-bg)"/>
    
    <!-- Newsroom Grid / World Map Lines -->
    <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
      <circle cx="320" cy="150" r="120" fill="none"/>
      <ellipse cx="320" cy="150" rx="120" ry="40" fill="none"/>
      <ellipse cx="320" cy="150" rx="120" ry="80" fill="none"/>
      <line x1="160" y1="150" x2="480" y2="150"/>
    </g>

    <!-- Top Badges -->
    <rect x="24" y="20" width="135" height="24" rx="4" fill="#dc2626"/>
    <text x="91" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="495" y="20" width="120" height="24" rx="4" fill="#dc2626"/>
    <circle cx="510" cy="32" r="4" fill="#ffffff"/>
    <text x="562" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">LIVE NEWS</text>

    <!-- Central Aaj Tak Logo Box -->
    <g transform="translate(320, 140)">
      <!-- 3D Channel Plate -->
      <rect x="-140" y="-55" width="280" height="110" rx="12" fill="#ffffff" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.6))"/>
      <rect x="-135" y="-50" width="270" height="100" rx="8" fill="#dc2626"/>
      
      <!-- Hindi "आज तक" Calligraphy -->
      <text x="0" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1">आज तक</text>
      <!-- English Brand Sub -->
      <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="url(#gold)" letter-spacing="5">AAJ TAK HD</text>
    </g>

    <!-- Slogan & Tag -->
    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="url(#gold)" letter-spacing="3">सबसे तेज़ • INDIA’S #1 NEWS NETWORK</text>
    <text x="320" y="266" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#fca5a5" letter-spacing="1">24/7 DIRECT SATELLITE BROADCAST FEED • 1080p HD</text>

    <!-- Breaking News Ticker Bar at Bottom -->
    <rect x="0" y="315" width="640" height="45" fill="#991b1b"/>
    <rect x="0" y="315" width="160" height="45" fill="#f59e0b"/>
    <text x="80" y="342" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="13" fill="#000000" letter-spacing="1">BREAKING</text>
    <text x="180" y="342" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">LIVE SATELLITE FEED • PRIME TIME DEBATES • WORLD BULLETINS</text>
  </svg>