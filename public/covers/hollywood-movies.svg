<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="mov-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#180c04"/>
        <stop offset="50%" stop-color="#381a07"/>
        <stop offset="100%" stop-color="#0c0502"/>
      </linearGradient>
      <linearGradient id="gold-shine" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#d97706"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#mov-bg)"/>

    <!-- Spotlights -->
    <polygon points="120,360 220,0 280,0 160,360" fill="#fbbf24" opacity="0.08"/>
    <polygon points="520,360 420,0 360,0 480,360" fill="#fbbf24" opacity="0.08"/>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#d97706"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="480" y="20" width="135" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="547" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#fef08a" letter-spacing="1">FREE CINEMA</text>

    <!-- Center Clapperboard & Film Reel -->
    <g transform="translate(320, 125)">
      <!-- Clapperboard -->
      <rect x="-60" y="-45" width="120" height="85" rx="6" fill="#1c1917" stroke="#fbbf24" stroke-width="2" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.8))"/>
      <!-- Diagonal stripes on top bar -->
      <rect x="-60" y="-45" width="120" height="22" fill="#ffffff"/>
      <polygon points="-60,-45 -40,-45 -55,-23 -60,-23" fill="#000000"/>
      <polygon points="-30,-45 -10,-45 -25,-23 -45,-23" fill="#000000"/>
      <polygon points="0,-45 20,-45 5,-23 -15,-23" fill="#000000"/>
      <polygon points="30,-45 50,-45 35,-23 15,-23" fill="#000000"/>
      <polygon points="60,-45 60,-30 45,-23 45,-23" fill="#000000"/>
      <!-- Production text -->
      <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="13" fill="#fef08a">HOLLYWOOD</text>
      <text x="0" y="25" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">SCENE 2026 • TAKE 1</text>
    </g>

    <!-- Typography -->
    <text x="320" y="225" text-anchor="middle" font-family="Arial Black, serif" font-weight="900" font-size="28" fill="url(#gold-shine)" letter-spacing="3">HOLLYWOOD FREE MOVIES</text>
    <text x="320" y="255" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="15" fill="#ffffff" letter-spacing="4">24/7 SATELLITE CINEMA MARATHON</text>

    <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#d6d3d1" letter-spacing="1">ACTION • THRILLER • BLOCKBUSTERS • COMEDY • WESTERNS</text>

    <!-- Bottom Gold Border -->
    <rect x="0" y="352" width="640" height="8" fill="url(#gold-shine)"/>
  </svg>