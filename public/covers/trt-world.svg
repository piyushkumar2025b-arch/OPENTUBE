<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="trt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0e7490"/>
        <stop offset="50%" stop-color="#155e75"/>
        <stop offset="100%" stop-color="#083344"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#trt-bg)"/>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#22d3ee"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="495" y="20" width="120" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="555" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">1080p HD</text>

    <!-- TRT World Typography & Logo -->
    <g transform="translate(320, 130)">
      <circle cx="-110" cy="0" r="40" fill="#ffffff" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.5))"/>
      <text x="-110" y="12" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="28" fill="#0891b2">TRT</text>
      
      <g transform="translate(-45, 0)">
        <text x="0" y="8" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">WORLD</text>
        <text x="0" y="36" font-family="sans-serif" font-weight="800" font-size="15" fill="#a5f3fc" letter-spacing="5">GLOBAL SATELLITE NETWORK</text>
      </g>
    </g>

    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#ffffff" letter-spacing="2">INTERNATIONAL GEOPOLITICS • CULTURE • DOCUMENTARIES</text>
    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#cffafe" letter-spacing="1">24/7 HIGH DEFINITION SATELLITE TRANSMISSION</text>

    <rect x="0" y="352" width="640" height="8" fill="#22d3ee"/>
  </svg>