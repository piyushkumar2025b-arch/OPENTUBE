<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="mp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ea580c"/>
        <stop offset="50%" stop-color="#f59e0b"/>
        <stop offset="100%" stop-color="#7c2d12"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#mp-bg)"/>

    <!-- Furfuri Nagar cartoon clouds & sun -->
    <circle cx="530" cy="90" r="45" fill="#fef08a" opacity="0.4"/>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#dc2626"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="490" y="20" width="125" height="24" rx="4" fill="#000000"/>
    <circle cx="505" cy="32" r="4" fill="#22c55e"/>
    <text x="562" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">CARTOON 24x7</text>

    <!-- Motu Patlu Iconic Comic Title Card -->
    <g transform="translate(320, 130)">
      <!-- Speech bubble plate -->
      <rect x="-150" y="-55" width="300" height="110" rx="20" fill="#ffffff" stroke="#dc2626" stroke-width="5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.4))"/>
      <text x="0" y="2" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="44" fill="#dc2626" letter-spacing="2">MOTU PATLU</text>
      <text x="0" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ea580c" letter-spacing="4">24/7 FURFURI NAGAR TV</text>
    </g>

    <!-- Samosa & Tagline -->
    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="2">SAMOSA POWER • DR. JHATKA • CHINGUM</text>
    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#fef3c7" letter-spacing="1">OFFICIAL NICKELODEON / WOWKIDZ HINDI CARTOON BROADCAST</text>

    <rect x="0" y="350" width="640" height="10" fill="#dc2626"/>
  </svg>