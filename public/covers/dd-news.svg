      <rect x="-140" y="-55" width="280" height="110" rx="12" fill="#0f172a" stroke="#dc2626" stroke-width="4" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.7))"/>
      <text x="0" y="8" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="2">DD NEWS</text>
      <text x="0" y="38" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#facc15" letter-spacing="4">दूरदर्शन समाचार • 1080p HD</text>
    </g>

