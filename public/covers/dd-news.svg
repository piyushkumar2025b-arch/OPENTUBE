    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#cbd5e1" letter-spacing="1">PARLIAMENT PROCEEDINGS • NATIONWIDE BULLETINS • GOVT AFFAIRS</text>

    <rect x="0" y="352" width="640" height="8" fill="#dc2626"/>
