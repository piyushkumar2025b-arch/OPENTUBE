<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="dis-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e3a8a"/>
        <stop offset="50%" stop-color="#3b82f6"/>
        <stop offset="100%" stop-color="#172554"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#dis-bg)"/>

    <!-- Magical Pixie Glow / Stars -->
    <g fill="#ffffff" opacity="0.4">
      <circle cx="150" cy="90" r="3"/>
      <circle cx="480" cy="110" r="4"/>
      <circle cx="320" cy="50" r="2"/>
    </g>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#fbbf24"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="495" y="20" width="120" height="24" rx="4" fill="rgba(255,255,255,0.2)"/>
    <text x="555" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">1080p HD</text>

    <!-- Mickey Silhouette & Disney Typography -->
    <g transform="translate(320, 130)">
      <!-- Mickey Silhouette in white -->
      <circle cx="0" cy="-20" r="30" fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.5))"/>
      <circle cx="-26" cy="-46" r="17" fill="#ffffff"/>
      <circle cx="26" cy="-46" r="17" fill="#ffffff"/>
      
      <text x="0" y="45" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-style="italic" font-size="46" fill="#ffffff" letter-spacing="1">Disney</text>
      <text x="0" y="70" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#fbbf24" letter-spacing="6">CHANNEL HD</text>
    </g>

    <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="16" fill="#93c5fd" letter-spacing="2">DUCKTALES • MICKEY MOUSE • PHINEAS &amp; FERB • GRAVITY FALLS</text>
    <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#bfdbfe" letter-spacing="1">MAGICAL ANIMATION &amp; CLASSIC FAMILY MOVIES 24/7</text>

    <rect x="0" y="352" width="640" height="8" fill="#fbbf24"/>
  </svg>