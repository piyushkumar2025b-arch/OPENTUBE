<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="bolly-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4a044e"/>
        <stop offset="50%" stop-color="#831843"/>
        <stop offset="100%" stop-color="#1f0212"/>
      </linearGradient>
      <linearGradient id="b-gold" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#facc15"/>
        <stop offset="50%" stop-color="#fef08a"/>
        <stop offset="100%" stop-color="#eab308"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#bolly-bg)"/>

    <!-- Gold Starlight Elements -->
    <g fill="#fde047" opacity="0.3">
      <polygon points="120,80 125,95 140,100 125,105 120,120 115,105 100,100 115,95"/>
      <polygon points="520,80 525,95 540,100 525,105 520,120 515,105 500,100 515,95"/>
    </g>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#e11d48"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="475" y="20" width="140" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="545" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#fde047" letter-spacing="1">HINDI CINEMA</text>

    <!-- Golden Cinema Emblem -->
    <g transform="translate(320, 125)">
      <!-- Golden Star & Film Frame -->
      <rect x="-110" y="-45" width="220" height="90" rx="10" fill="#2e0520" stroke="url(#b-gold)" stroke-width="3" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.8))"/>
      <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">BOLLYWOOD</text>
      <text x="0" y="24" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="url(#b-gold)" letter-spacing="4">CINEMA 24x7</text>
    </g>

    <!-- Taglines -->
    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="url(#b-gold)" letter-spacing="3">B4U / MASALA BLOCKBUSTERS • NON-STOP HITS</text>
    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#fbcfe8" letter-spacing="1">1080p SATELLITE TRANSMISSION • CLASSIC &amp; MODERN HINDI MOVIES</text>

    <!-- Bottom Indian Accent Bar -->
    <rect x="0" y="352" width="640" height="8" fill="url(#b-gold)"/>
  </svg>