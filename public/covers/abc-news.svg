<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="abc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#abc-bg)"/>

    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#fbbf24"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000" letter-spacing="1">📡 SATELLITE TV</text>

    <rect x="490" y="20" width="125" height="24" rx="4" fill="#dc2626"/>
    <circle cx="505" cy="32" r="4" fill="#ffffff"/>
    <text x="560" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">LIVE 24/7</text>

    <!-- ABC Circle & News Live -->
    <g transform="translate(320, 130)">
      <!-- Iconic ABC circle logo -->
      <circle cx="-110" cy="0" r="42" fill="#000000" stroke="#ffffff" stroke-width="4" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.7))"/>
      <text x="-110" y="14" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="-1">abc</text>
      
      <g transform="translate(-45, 0)">
        <text x="0" y="-8" font-family="Arial Black, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="2">NEWS</text>
        <rect x="130" y="-38" width="80" height="36" rx="6" fill="#f59e0b"/>
        <text x="170" y="-14" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="20" fill="#000000">LIVE</text>
        <text x="0" y="24" font-family="sans-serif" font-weight="800" font-size="16" fill="#94a3b8" letter-spacing="4">AMERICAN BROADCASTING CO.</text>
      </g>
    </g>

    <text x="320" y="240" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#ffffff" letter-spacing="2">GLOBAL CORRESPONDENTS • PRIME TIME BULLETINS</text>
    <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" letter-spacing="1">OFFICIAL 1080p SATELLITE &amp; DIGITAL NETWORK FEED</text>

    <rect x="0" y="352" width="640" height="8" fill="#fbbf24"/>
  </svg>