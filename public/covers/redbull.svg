<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
    <defs>
      <linearGradient id="rb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
    </defs>
    <rect width="640" height="360" fill="url(#rb-bg)"/>
    <!-- Top Badges -->
    <rect x="24" y="20" width="145" height="24" rx="4" fill="#dc2626"/>
    <text x="96" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" letter-spacing="1">📡 SATELLITE TV</text>
    <rect x="495" y="20" width="120" height="24" rx="4" fill="#facc15"/>
    <text x="555" y="36" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="11" fill="#000000">ACTION 24/7</text>
    <!-- Red Bull TV Emblem -->
    <g transform="translate(320, 130)">
      <circle cx="0" cy="-10" r="35" fill="#facc15"/>
      <text x="0" y="35" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">Red Bull</text>
      <text x="0" y="60" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#dc2626" letter-spacing="6">TV HD</text>
    </g>
    <text x="320" y="245" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#ffffff" letter-spacing="2">EXTREME SPORTS • ADVENTURE • CULTURE</text>
    <text x="320" y="272" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#cbd5e1" letter-spacing="1">FORMULA 1 • SURFING • MOTOCROSS • MOUNTAIN BIKING</text>
    <rect x="0" y="352" width="640" height="8" fill="#dc2626"/>
  </svg>